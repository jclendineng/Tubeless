name: CI Base Image

on:
  push:
    branches: ['main']
    paths:
      - 'docker/ci-base.Dockerfile'
      - 'docker/ci-base.requirements.txt'
      - '.github/workflows/ci-base.yml'
  # A PR that changes the base image builds and smoke-tests it. It only publishes the
  # floating :ci-base tag when none exists yet (a fresh fork), since GitHub won't run
  # this workflow by hand until it is on the default branch.
  pull_request:
    branches: ['main']
    paths:
      - 'docker/ci-base.Dockerfile'
      - 'docker/ci-base.requirements.txt'
      - '.github/workflows/ci-base.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build, Smoke, and Push CI Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/jclendineng/tubeless
      CI_BASE_IMAGE: ghcr.io/jclendineng/tubeless:ci-base

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "sha_tag=${IMAGE_REPO}:ci-base-sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "latest_tag=${IMAGE_REPO}:ci-base" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main and manual runs always publish. A PR from this repository publishes only
      # to bootstrap a missing :ci-base, and a PR from a fork never does (its token is
      # read-only).
      - name: Decide what to publish
        id: publish
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          LATEST_TAG: ${{ steps.tags.outputs.latest_tag }}
        run: |
          if [ "$IS_PR" != "true" ]; then
            echo "push=true" >> $GITHUB_OUTPUT
          elif [ "$SAME_REPO" = "true" ] && ! docker manifest inspect "$LATEST_TAG" >/dev/null 2>&1; then
            echo "No $LATEST_TAG yet, publishing it from this PR"
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "push=false" >> $GITHUB_OUTPUT
          fi

      # Build amd64 locally first so we can smoke-test before pushing anything.
      # The multi-arch push later reuses the buildx cache, so the second build
      # is cheap.
      - name: Build for smoke test (amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/ci-base.Dockerfile
          platforms: linux/amd64
          load: true
          tags: tubeless-ci-base:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test toolchain
        run: |
          docker run --rm tubeless-ci-base:smoke sh -c '
            set -eux
            mix --version
            node --version
            yarn --version
            deno --version
            yt-dlp --version
            apprise --version
            ffmpeg -version | head -1
            ffprobe -version | head -1
          '

      - name: Build and push (multi-arch)
        if: steps.publish.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/ci-base.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.publish.outputs.push == 'true'
        run: |
          echo "Pushed:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.tags.outputs.sha_tag }}\` (immutable; pin consumers here)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.tags.outputs.latest_tag }}\` (floating; local dev only)" >> $GITHUB_STEP_SUMMARY
