name: Publish Fork Image

# The fork's own server image on ghcr.io. No secrets needed: the workflow token can
# push packages to the repository owner's namespace.
# :latest (and a pull with no tag) is main, :development is the development branch,
# every build gets an immutable :sha-<short> tag to pin or roll back to, and a v* git
# tag adds :<version> and :<major>.<minor>.
on:
  push:
    branches: [main, development]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pick image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/tubeless
          # latest is set by hand below, a version tag alone must not move it off main
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/development' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Tubeless
            org.opencontainers.image.description=Tubeless (fork)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CI_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/tubeless:ci-base
          cache-from: type=gha,scope=fork-image
          cache-to: type=gha,scope=fork-image,mode=max
