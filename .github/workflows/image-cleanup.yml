name: Dev Image Cleanup

# Prunes the PR and RC images in the tubeless-dev package, keeping the 3 newest.
# The workflow token can delete them because the package is linked to this repo,
# so no secret is needed. Plain API calls rather than a JavaScript action, so there
# is no Node runtime to fall out of date.
on:
  schedule:
    - cron: '5 0 * * *' # every day at 00:05 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old dev images
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSIONS: /users/${{ github.repository_owner }}/packages/container/tubeless-dev/versions
      KEEP: 3
    steps:
      - name: Delete all but the newest dev images
        run: |
          # the API lists newest first
          ids=$(gh api --paginate "$VERSIONS?per_page=100" --jq '.[].id' | tail -n +$((KEEP + 1)))
          for id in $ids; do
            gh api -X DELETE "$VERSIONS/$id"
            echo "Deleted version $id"
          done
          echo "Deleted $(echo "$ids" | grep -c .) version(s), kept the newest $KEEP"
