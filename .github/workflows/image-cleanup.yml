name: Dev Image Cleanup

# Prunes the PR and RC images in the tubeless-dev package, keeping the 3 newest.
# The workflow token can delete them because the package is linked to this repo,
# so no secret is needed.
on:
  schedule:
    - cron: '5 0 * * *' # every day at 00:05 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old dev images
    timeout-minutes: 10
    # the action still declares Node 20, which runners have retired. opt in to
    # Node 24 so it runs there by choice rather than with a deprecation warning
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ github.repository_owner }}
          package-name: tubeless-dev
          package-type: container
          min-versions-to-keep: 3
