version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /docker/
    schedule: { interval: weekly }
  - package-ecosystem: mix
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: [/, /assets]
    schedule: { interval: weekly }
